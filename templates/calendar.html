{% extends 'base.html' %}
{% block title %}Calendar - Smart Reminder{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <div>
        <h1 class="h3 fw-bold mb-1"><i class="bi bi-calendar3"></i> Calendar</h1>
        <p class="text-muted mb-0">View your reminder due dates by month.</p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        <span class="badge rounded-pill text-bg-danger">High Priority</span>
        <span class="badge rounded-pill text-bg-warning text-dark">Medium Priority</span>
        <span class="badge rounded-pill text-bg-success">Low Priority</span>
    </div>
</div>

<div class="card shadow-sm calendar-shell">
    <div class="card-body">
        <div id="reminderCalendar"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const calendarElement = document.getElementById('reminderCalendar');
    const reminderEvents = {{ calendar_events|safe }};
    const remindersByDate = reminderEvents.reduce(function (grouped, event) {
        const dateKey = event.start.slice(0, 10);
        grouped[dateKey] = grouped[dateKey] || [];
        grouped[dateKey].push(event);
        return grouped;
    }, {});

    function formatDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }

    function formatDateTitle(date) {
        return date.toLocaleDateString('en-ZA', {
            weekday: 'long',
            day: '2-digit',
            month: 'long'
        }) + ' events';
    }

    function priorityClass(priority) {
        if (priority === 'High') {
            return 'calendar-popover-dot-high';
        }
        if (priority === 'Medium') {
            return 'calendar-popover-dot-medium';
        }
        return 'calendar-popover-dot-low';
    }

    function buildPopoverContent(reminders) {
        return reminders.map(function (reminder) {
            return '<a class="calendar-popover-item" href="' + reminder.url + '">' +
                '<span class="calendar-popover-dot ' + priorityClass(reminder.extendedProps.priority) + '"></span>' +
                '<span>' + reminder.title + ' is due</span>' +
            '</a>';
        }).join('');
    }

    const calendar = new FullCalendar.Calendar(calendarElement, {
        initialView: 'dayGridMonth',
        initialDate: new Date(),
        height: '100%',
        expandRows: true,
        dayMaxEvents: 2,
        events: reminderEvents,
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,listMonth'
        },
        eventDisplay: 'block',
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            meridiem: false
        },
        eventDidMount: function (info) {
            if (info.event.extendedProps.subject) {
                info.el.title = info.event.title + ' - ' + info.event.extendedProps.subject + ' (' + info.event.extendedProps.priority + ')';
            }
        },
        dayCellDidMount: function (info) {
            const dateKey = formatDateKey(info.date);
            const reminders = remindersByDate[dateKey] || [];

            if (!reminders.length) {
                return;
            }

            info.el.classList.add('calendar-day-has-reminders');
            info.el.setAttribute('tabindex', '0');

            new bootstrap.Popover(info.el, {
                title: formatDateTitle(info.date),
                content: buildPopoverContent(reminders),
                html: true,
                trigger: 'hover focus',
                placement: 'auto',
                container: 'body',
                customClass: 'calendar-reminder-popover'
            });
        }
    });
    calendar.render();
});
</script>
{% endblock %}
